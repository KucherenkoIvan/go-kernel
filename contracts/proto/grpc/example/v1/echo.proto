// Example contract — the template for real services.
//
// Layout convention: proto/grpc/<domain>/<version>/<service>.proto, one
// directory per bounded context, versioned from day one.
syntax = "proto3";

package grpc.example.v1;

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}
